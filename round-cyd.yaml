                  widgets:
                    - label:
                        text: "\U000F0CB8"
                        text_font: f_icon
                        text_color: ${col_accent}
                        align: LEFT_MID
                        x: 12
                    - label:
                        text: "${work2_name}"
                        width: 126
                        align: LEFT_MID
                        x: 46
                        long_mode: DOT
                  on_click:
                    - homeassistant.action:
                        action: music_assistant.play_media
                        data:
                          entity_id: ${player}
                          media_id: "${work2_uri}"
                          media_type: playlist
                          enqueue: replace
                    - lvgl.tileview.select: {id: tiles, tile_id: tile_now, animated: true}
              - button:
                  align: TOP_MID
                  y: 150
                  width: 180
                  height: 42
                  radius: 21
                  widgets:
                    - label:
                        text: "\U000F0CB8"
                        text_font: f_icon
