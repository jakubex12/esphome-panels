                        align: LEFT_MID
                        x: 12
                    - label:
                        text: "${work3_name}"
                        width: 126
                        align: LEFT_MID
                        x: 46
                        long_mode: DOT
                  on_click:
                    - homeassistant.action:
                        action: music_assistant.play_media
                        data:
                          entity_id: ${player}
                          media_id: "${work3_uri}"
                          media_type: playlist
                          enqueue: replace
                    - lvgl.tileview.select: {id: tiles, tile_id: tile_now, animated: true}

              - obj: {styles: dot, x: 105}
