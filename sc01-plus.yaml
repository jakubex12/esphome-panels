                  height: 56
                  widgets:
                    - label:
                        text: "\U000F075E"
                        text_font: f_icon
                        align: CENTER
                  on_click:
                    - homeassistant.action:
                        action: media_player.volume_down
                        data:
                          entity_id: ${player}
              - slider:
                  id: sld_vol
                  x: 84
                  y: 384
                  width: 152
                  height: 20
                  min_value: 0
                  max_value: 100
                  bg_color: 0x1E2532
                  radius: 10
                  indicator:
                    bg_color: ${col_accent}
                    radius: 10
                  knob:
                    bg_color: 0xFFFFFF
                    radius: 14
                    pad_all: 7
                  on_change:
                    - lambda: "id(vol_touch_ts) = millis();"
                    - lvgl.label.update:
                        id: lbl_vol
                        text: !lambda |-
                          char buf[8];
                          snprintf(buf, sizeof(buf), "%d%%", (int) x);
                          return std::string(buf);
                    - script.execute:
                        id: push_volume
                        vol: !lambda "return (int) x;"
