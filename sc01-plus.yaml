# Board: wt32-sc01-plus  (ESP32-S3, ST7796 480x320, dotyk FT6336, magistrala 8-bit i80)
# Definition: definitions/boards/wt32-sc01-plus/manifest.yaml
#
# Panel sterowania muzyką w salonie (Music Assistant).
#   Zakładka "Teraz gra" – tytuł/wykonawca, prev / play-pause / next, głośność (suwak + / -)
#   Zakładka "Radio"     – 3 stacje z biblioteki Music Assistant
#   Zakładka "Muzyka"    – 6 playlist z Music Assistant
#
# WAŻNE po pierwszym wgraniu:
#   HA → Ustawienia → Urządzenia → ESPHome → sc01-plus → koło zębate →
#   zaznacz "Zezwól urządzeniu na wykonywanie akcji Home Assistant".
#   Bez tego przyciski nic nie zrobią (homeassistant.action zostanie odrzucone).
#
# Zmiana presetów: wystarczy podmienić nazwy i URI w sekcji "substitutions" niżej.
# Aktualną listę URI daje akcja music_assistant.get_library (media_type: radio / playlist).

substitutions:
  player: media_player.salon_3        # Music Assistant → Salon
  # HA w LAN, zwykly HTTP - z niego idzie okladka (/api/media_player_proxy/...).
  # HA sam pobiera obrazek z HTTPS, wiec ESP nie potrzebuje TLS.
  ha_url: "http://192.168.1.171:8123"

  # Radio: lista 1 kolumna x 6 wierszy po 292 px (uklad pionowy).
  # Kafel Trojki pokazuje sam logotyp (wordmark), wiec nie ma radio3_name.
  radio1_name: "Radio 357"
  radio1_uri: "library://radio/1"
  radio2_name: "Radio Nowy Świat"
  radio2_uri: "library://radio/2"
  radio3_uri: "library://radio/3"
  radio4_name: "Chilli ZET"
  # Chilli ZET nie jest w bibliotece MA - URI dostawcy z RadioBrowser
  radio4_uri: "radiobrowser://radio/40114c00-90ca-4c7d-a5b2-2f91616cacae"

  mus1_name: "Ulubione"
  mus1_uri: "library://playlist/1"
  mus2_name: "500 losowych"
  mus2_uri: "library://playlist/4"
  mus3_name: "Infinite Mix"
  mus3_uri: "library://playlist/89"
  mus4_name: "All Out 80s"
  mus4_uri: "library://playlist/53"
  mus5_name: "Golden po polsku"
  mus5_uri: "library://playlist/97"
  mus6_name: "Warszawianka"
  mus6_uri: "library://playlist/50"

  # czasy wygaszania ekranu
  idle_dim: 30s            # przygaszenie - ekran dalej pokazuje co gra
  idle_off: 1min           # calkowite wylaczenie ekranu

  # paleta (ciemna; col_bg2 to dolny kolor gradientu tla)
  col_bg: "0x05070B"
  col_bg2: "0x0D1320"
  col_card: "0x121826"
  col_btn: "0x1A2130"
  col_btn_press: "0x2B364A"
  col_border: "0x2A3648"
  col_accent: "0x2F6BFF"
  col_eq_top: "0x7FD8FF"     # gora slupkow korektora (dol = col_accent)
  col_text: "0xE8ECF4"
  col_text_dim: "0x8A93A5"

esphome:
  name: sc01-plus
  friendly_name: sc01-plus
  min_version: 2025.7.0

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

# PSRAM jest wymagane przez sterownik wyświetlacza (bufor LVGL).
# Jeśli w logach pojawi się błąd inicjalizacji PSRAM, zmień mode na octal.
psram:
  mode: quad
  speed: 80MHz

logger:

api:
  encryption:
    key: !secret sc01_plus_api_key

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: sc01-plus Fallback Hotspot
    password: !secret sc01_plus_ap_password

  #use_address: 192.168.100.168
captive_portal:

# ---------------------------------------------------------------- wyświetlacz
spi:
  - id: lcd_bus
    type: octal
    clk_pin: 47
    data_pins:
      - 9
      - number: 46
        ignore_strapping_warning: true
      - number: 3
        ignore_strapping_warning: true
      - 8
      - 18
      - 17
      - 16
      - 15

display:
  - platform: mipi_spi
    id: lcd
    model: WT32-SC01-PLUS
    spi_id: lcd_bus
    data_rate: 10MHz
    # UWAGA: przy LVGL rotacji NIE ustawia się tutaj - jest w sekcji lvgl niżej.

output:
  - platform: ledc
    id: backlight_out
    pin:
      number: 45
      ignore_strapping_warning: true

light:
  - platform: monochromatic
    id: backlight
    name: Podświetlenie
    output: backlight_out
    restore_mode: ALWAYS_ON
    default_transition_length: 300ms

i2c:
  sda: 6
  scl: 5
  frequency: 400kHz

touchscreen:
  - platform: ft63x6
    id: touch
    display: lcd
    interrupt_pin: 7
    # Bez transform! Dotyk podaje surowe wspolrzedne panelu (320x480),
    # a LVGL sam je obraca zgodnie ze swoim 'rotation'.
    on_touch:
      # wybudzenie: pełna jasność (LVGL sam wraca z pauzy - resume_on_input)
      - light.turn_on:
          id: backlight
          brightness: 100%

# --------------------------------------------------------------------- czcionki
font:
  - file:
      type: gfonts
      family: Inter
      weight: 700
    id: f_title
    size: 26
    bpp: 4
    glyphsets: [GF_Latin_Core]
    glyphs: ["ąćęłńóśźżĄĆĘŁŃÓŚŹŻ•–—"]

  - file:
      type: gfonts
      family: Inter
      weight: 500
    id: f_body
    size: 18
    bpp: 4
    glyphsets: [GF_Latin_Core]
    glyphs: ["ąćęłńóśźżĄĆĘŁŃÓŚŹŻ•–—"]

  - file:
      type: gfonts
      family: Inter
      weight: 600
    id: f_tab
    size: 16
    bpp: 4
    glyphsets: [GF_Latin_Core]
    glyphs: ["ąćęłńóśźżĄĆĘŁŃÓŚŹŻ"]

  - file:
      type: gfonts
      family: Inter
      weight: 400
    id: f_small
    size: 14
    bpp: 4
    glyphsets: [GF_Latin_Core]
    glyphs: ["ąćęłńóśźżĄĆĘŁŃÓŚŹŻ•"]

  # Material Design Icons - tylko potrzebne znaki
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: f_icon_big
    size: 44
    bpp: 4
    glyphs: ["\U000F040A", "\U000F03E4"]            # play, pause
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: f_icon
    size: 28
    bpp: 4
    glyphs:
      - "\U000F04AE"   # skip-previous
      - "\U000F04AD"   # skip-next
      - "\U000F075E"   # volume-minus
      - "\U000F075D"   # volume-plus
      - "\U000F0CB8"   # playlist-music

# ---------------------------------------------------------------- grafika
# Logo Music Assistant - zastepcza okladka (gdy brak / w trakcie pobierania).
# 200x200 RGB565+alfa = ~120 kB flasha.
image:
  # Logotypy stacji - pliki lokalne w esphome/images/, zeby build nie zalezal
  # od cudzych serwerow. resize dobrany do proporcji oryginalu.
  - platform: file
    id: img_r357            # 963x963
    file: images/radio357.png
    type: RGB565
    transparency: alpha_channel
    resize: 48x48
  - platform: file
    id: img_rns             # 180x180
    file: images/nowyswiat.png
    type: RGB565
    transparency: alpha_channel
    resize: 48x48
  - platform: file
    id: img_chilli          # 120x120
    file: images/chillizet.png
    type: RGB565
    transparency: alpha_channel
    resize: 48x48
  - platform: file
    id: img_trojka          # 250x88 - wordmark, stad inne proporcje
    file: images/trojka.png
    type: RGB565
    transparency: alpha_channel
    resize: 140x49

  - platform: file
    id: img_ma
    file: "https://brands.home-assistant.io/music_assistant/icon.png"
    type: RGB565
    transparency: alpha_channel
    resize: 200x200

  # Okladka z HA (proxy media_player). Format rozpoznawany po Content-Type
  # (radio daje PNG, Spotify JPEG). resize zachowuje proporcje - miesci sie w 160x160.
  # Dekodowany bufor siedzi w PSRAM.
  - platform: online_image
    id: img_cover_web
    url: "${ha_url}/"                # prawdziwy URL ustawia text_sensor ha_cover
    format: AUTO
    type: RGB565
    resize: 160x160
    update_interval: never
    on_download_finished:
      - script.execute: {id: show_cover, web: true}
    on_error:
      - script.execute: {id: show_cover, web: false}

http_request:
  timeout: 10s

# ------------------------------------------------------- stan gracza z HA
globals:
  - id: vol_touch_ts
    type: uint32_t
    restore_value: false
    initial_value: "0"
  # ostatnio pobierany URL okladki - zeby nie pobierac tego samego drugi raz
  - id: cover_url
    type: std::string
    restore_value: false
    initial_value: '""'

script:
  # Przelacza ramke okladki: web=true -> pobrana okladka, false -> logo MA.
  - id: show_cover
    mode: restart
    parameters:
      web: bool
    then:
      - if:
          condition:
            lambda: "return web;"
          then:
            - lvgl.image.update:
                id: img_cover
                src: img_cover_web
                scale: 1.0
                pivot_x: 80
                pivot_y: 80
                image_opa: COVER
          else:
            - lvgl.image.update:
                id: img_cover
                src: img_ma
                scale: 0.6
                pivot_x: 100
                pivot_y: 100
                image_opa: 55%

  # Suwak wysyła jedną akcję ~400 ms po puszczeniu, a nie przy każdym pikselu.
  - id: push_volume
    mode: restart
    parameters:
      vol: int
    then:
      - delay: 400ms
      - homeassistant.action:
          action: media_player.volume_set
          data:
            entity_id: ${player}
          data_template:
            volume_level: "{{ v }}"
          variables:
            v: !lambda "return vol / 100.0f;"

text_sensor:
  - platform: homeassistant
    id: ha_state
    entity_id: ${player}
    on_value:
      - lvgl.label.update:
          id: lbl_icon_play
          text: !lambda |-
            return x == "playing" ? std::string("\U000F03E4") : std::string("\U000F040A");
      - lvgl.widget.update:
          id: btn_play
          bg_color: !lambda |-
            return x == "playing" ? lv_color_hex(${col_accent}) : lv_color_hex(${col_btn});
          # 255 = kryjacy (grA), 140 = ~55% (jak reszta guzikow)
          bg_opa: !lambda "return x == \"playing\" ? 255 : 140;"
      - lvgl.label.update:
          id: lbl_state
          text: !lambda |-
            if (x == "playing") return std::string("Odtwarzanie");
            if (x == "paused") return std::string("Pauza");
            if (x == "idle") return std::string("Bezczynny");
            if (x == "off") return std::string("Wyłączony");
            if (x == "unavailable" || x == "unknown") return std::string("Niedostępny");
            return x;

  - platform: homeassistant
    id: ha_title
    entity_id: ${player}
    attribute: media_title
    on_value:
      - lvgl.label.update:
          id: lbl_title
          text: !lambda |-
            if (x.empty() || x == "unknown") return std::string("Nic nie gra");
            return x;

  # Okladka: entity_picture_local to sciezka proxy HA z tokenem
  # (/api/media_player_proxy/...?token=...&cache=...), zmienia sie z utworem.
  - platform: homeassistant
    id: ha_cover
    entity_id: ${player}
    attribute: entity_picture_local
    on_value:
      - lambda: |-
          std::string url;
          if (!x.empty() && x != "unknown" && x != "None")
            url = x.rfind("http", 0) == 0 ? x : std::string("${ha_url}") + x;
          if (url == id(cover_url)) return;
          id(cover_url) = url;
          // na czas pobierania (i gdy okladki brak) logo MA - LVGL nie moze
          // rysowac z bufora, ktory online_image wlasnie przealokowuje
          id(show_cover).execute(false);
          if (url.empty()) {
            id(img_cover_web).release();
          } else {
            id(img_cover_web).set_url(url);
            id(img_cover_web).update();
          }

  - platform: homeassistant
    id: ha_artist
    entity_id: ${player}
    attribute: media_artist
    on_value:
      - lvgl.label.update:
          id: lbl_artist
          text: !lambda |-
            if (x.empty() || x == "unknown") return std::string("—");
            return x;

sensor:
  - platform: homeassistant
    id: ha_volume
    entity_id: ${player}
    attribute: volume_level
    on_value:
      # nie nadpisuj suwaka, dopóki ktoś go trzyma / właśnie puścił
      - if:
          condition:
            lambda: "return millis() - id(vol_touch_ts) > 2500;"
          then:
            - lvgl.slider.update:
                id: sld_vol
                value: !lambda "return x * 100.0f;"
            - lvgl.label.update:
                id: lbl_vol
                text: !lambda |-
                  char buf[8];
                  snprintf(buf, sizeof(buf), "%d%%", (int) (x * 100.0f + 0.5f));
                  return std::string(buf);

# ------------------------------------------------------ animacja korektora
# Co 90 ms kazdy slupek dojezdza (wygladzanie) do losowego celu. Srodkowe
# slupki sa srednio wyzsze. Gdy nic nie gra - slupki opadaja i animacja staje,
# a przy wygaszonym ekranie (lvgl.pause) nic nie jest liczone.
interval:
  - interval: 90ms
    then:
      - lambda: |-
          static const int N = 16;
          static const float H_MIN = 6.0f, H_MAX = 230.0f;
          static float h[N], target[N];
          static bool settled = false;
          if (id(lvgl_comp)->is_paused()) return;
          lv_obj_t *bars[N] = {id(eq0), id(eq1), id(eq2), id(eq3), id(eq4), id(eq5), id(eq6), id(eq7), id(eq8), id(eq9), id(eq10), id(eq11), id(eq12), id(eq13), id(eq14), id(eq15)};
          const bool playing = id(ha_state).state == "playing";
          if (!playing && settled) return;
          bool all_low = true;
          for (int i = 0; i < N; i++) {
            if (playing) {
              // obwiednia: srodek wyzszy, brzegi nizsze
              float c = (i - (N - 1) / 2.0f) / ((N - 1) / 2.0f);
              float env = 1.0f - 0.55f * c * c;
              if (std::fabs(h[i] - target[i]) < 6.0f || target[i] <= H_MIN)
                target[i] = H_MIN + (random_uint32() % 1000) / 1000.0f * (H_MAX - H_MIN) * env;
              h[i] += (target[i] - h[i]) * 0.35f;
            } else {
              h[i] += (H_MIN - h[i]) * 0.25f;
              target[i] = H_MIN;
            }
            if (h[i] > H_MIN + 1.0f) all_low = false;
            lv_obj_set_height(bars[i], (int32_t) h[i]);
          }
          settled = !playing && all_low;

# -------------------------------------------------------------------- interfejs
lvgl:
  id: lvgl_comp
  displays: [lcd]
  touchscreens: [touch]
  # Pion 320x480. Natywna orientacja panelu to 0, ale Ty potrzebowales w poziomie
  # 270 zamiast 90, czyli panel jest zamontowany 'do gory nogami' wzgledem
  # natywnej - dlatego tu 180. Jesli obraz wyjdzie odwrocony, zmien na 0.
  rotation: 180°
  default_font: f_body
  bottom_layer:
    bg_color: ${col_bg}

  # Wygaszanie ekranu. Dotyk budzi (patrz touchscreen.on_touch).
  # Kazdy prog wyzwala sie raz i zbroi sie ponownie po dotknieciu.
  on_idle:
    # 1) przygaszenie - ekran nadal odswieza sie i pokazuje, co gra
    - timeout: ${idle_dim}
      then:
        - light.turn_on:
            id: backlight
            brightness: 12%
    # 2) calkowite wygaszenie + pauza LVGL, zeby pierwszy dotyk tylko budzil
    #    (nie wcisnal przypadkiem przycisku pod palcem)
    - timeout: ${idle_off}
      then:
        - light.turn_off: backlight
        - lvgl.pause:

  theme:
    # bez tego niestylowane czesci widgetow (m.in. tlo samego tabview)
    # biora jasne kolory z domyslnego motywu LVGL
    dark_mode: true
    obj:
      border_width: 0
      pad_all: 0
      bg_opa: COVER
    label:
      text_color: ${col_text}
    button:
      bg_color: ${col_btn}
      bg_opa: 55%              # lekko przepuszcza gradient tla
      radius: 14
      border_width: 1          # ramka - inaczej polprzezroczysty guzik gubi sie w tle
      border_color: ${col_border}
      border_opa: COVER
      text_color: ${col_text}
      pressed:
        bg_color: ${col_btn_press}
        bg_opa: COVER          # wyrazna reakcja na dotyk

  style_definitions:
    - id: eq_bar
      width: 12
      height: 6
      radius: 4
      bg_color: ${col_accent}
      bg_grad_color: ${col_eq_top}
      bg_grad_dir: VER
      bg_opa: 22%
      border_width: 0

  widgets:
    - tabview:
        id: tabs
        bg_color: ${col_bg}
        position: BOTTOM
        size: 52
        tab_style:
          bg_color: ${col_bg}
          pad_all: 0
          border_width: 0
          items:
            bg_color: ${col_bg}
            text_color: ${col_text_dim}
            text_font: f_tab
            radius: 0
            border_width: 0
            checked:
              bg_color: ${col_card}
              text_color: 0xFFFFFF
              border_width: 3
              border_color: ${col_accent}
              border_side: TOP
        content_style:
          bg_color: ${col_bg}
          pad_all: 0
          border_width: 0
        tabs:
          # ================================================== TERAZ GRA
          # Obszar tresci 320x428. Pionowy stos:
          #   naglowek 4..26 | okladka 30..190 | tytul 198..256
          #   wykonawca 258..280 | transport 286..358 | glosnosc 366..422
          - name: "Teraz gra"
            bg_color: ${col_bg}
            bg_grad_color: ${col_bg2}
            bg_grad_dir: VER
            pad_all: 0
            border_width: 0
            scrollable: false
            scrollbar_mode: "OFF"
            widgets:
              # Korektor w tle - tylko ozdoba, nie zwiazany z dzwiekiem.
              # 16 slupkow przyklejonych do dolu; wysokosci zmienia interval eq_anim.
              # Lezy pierwszy, wiec wszystko inne rysuje sie nad nim.
              - obj:
                  id: eq_box
                  x: 0
                  y: 178
                  width: 320
                  height: 250
                  bg_opa: TRANSP
                  pad_all: 0
                  clickable: false
                  scrollable: false
                  scrollbar_mode: "OFF"
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_main: SPACE_EVENLY
                    flex_align_cross: END
                    flex_align_track: END
                  widgets:
                    - obj: {id: eq0, styles: eq_bar, clickable: false}
                    - obj: {id: eq1, styles: eq_bar, clickable: false}
                    - obj: {id: eq2, styles: eq_bar, clickable: false}
                    - obj: {id: eq3, styles: eq_bar, clickable: false}
                    - obj: {id: eq4, styles: eq_bar, clickable: false}
                    - obj: {id: eq5, styles: eq_bar, clickable: false}
                    - obj: {id: eq6, styles: eq_bar, clickable: false}
                    - obj: {id: eq7, styles: eq_bar, clickable: false}
                    - obj: {id: eq8, styles: eq_bar, clickable: false}
                    - obj: {id: eq9, styles: eq_bar, clickable: false}
                    - obj: {id: eq10, styles: eq_bar, clickable: false}
                    - obj: {id: eq11, styles: eq_bar, clickable: false}
                    - obj: {id: eq12, styles: eq_bar, clickable: false}
                    - obj: {id: eq13, styles: eq_bar, clickable: false}
                    - obj: {id: eq14, styles: eq_bar, clickable: false}
                    - obj: {id: eq15, styles: eq_bar, clickable: false}
              - label:
                  id: lbl_state
                  x: 14
                  y: 4
                  width: 170
                  height: 22
                  text: "Łączenie…"
                  text_font: f_small
                  text_color: ${col_text_dim}
              - label:
                  id: lbl_vol
                  x: 180
                  y: 4
                  width: 126
                  height: 22
                  text: "--%"
                  text_font: f_small
                  text_color: ${col_text_dim}
                  text_align: RIGHT

              # Ramka okladki 160x160. Pokazuje okladke z HA (img_cover_web),
              # a na czas pobierania / przy bledzie / gdy nic nie gra - logo MA
              # (img_ma, przeskalowane). Patrz script show_cover.
              - obj:
                  id: card_cover
                  x: 80
                  y: 30
                  width: 160
                  height: 160
                  bg_color: ${col_card}
                  bg_opa: COVER
                  radius: 16
                  clip_corner: true      # okladka dostaje zaokraglone rogi ramki
                  border_width: 1
                  border_color: ${col_border}
                  pad_all: 0
                  scrollable: false
                  scrollbar_mode: "OFF"
                  widgets:
                    - image:
                        id: img_cover
                        src: img_ma
                        align: CENTER
                        scale: 0.6            # 200 px * 0.6 = 120 px
                        pivot_x: 100          # jawnie srodek obrazka 200x200,
                        pivot_y: 100          # inaczej skalowanie moglo by uciec w rog
                        image_opa: 55%

              - label:
                  id: lbl_title
                  x: 14
                  y: 198
                  width: 292
                  height: 58
                  text: "Nic nie gra"
                  text_font: f_title
                  long_mode: DOT
              - label:
                  id: lbl_artist
                  x: 14
                  y: 258
                  width: 292
                  height: 22
                  text: "—"
                  text_color: ${col_text_dim}
                  long_mode: DOT

              - button:
                  id: btn_prev
                  x: 14
                  y: 290
                  width: 84
                  height: 64
                  widgets:
                    - label:
                        text: "\U000F04AE"
                        text_font: f_icon
                        align: CENTER
                  on_click:
                    - homeassistant.action:
                        action: media_player.media_previous_track
                        data:
                          entity_id: ${player}
              - button:
                  id: btn_play
                  x: 112
                  y: 286
                  width: 96
                  height: 72
                  widgets:
                    - label:
                        id: lbl_icon_play
                        text: "\U000F040A"
                        text_font: f_icon_big
                        align: CENTER
                  on_click:
                    - homeassistant.action:
                        action: media_player.media_play_pause
                        data:
                          entity_id: ${player}
              - button:
                  id: btn_next
                  x: 222
                  y: 290
                  width: 84
                  height: 64
                  widgets:
                    - label:
                        text: "\U000F04AD"
                        text_font: f_icon
                        align: CENTER
                  on_click:
                    - homeassistant.action:
                        action: media_player.media_next_track
                        data:
                          entity_id: ${player}

              - button:
                  id: btn_vol_down
                  x: 14
                  y: 366
